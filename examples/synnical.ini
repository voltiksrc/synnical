# Copy to ~/.config/synnical/synnical.ini
# Paths beginning with ~/ are expanded automatically.

[general]
color = auto
verbose = false

[paths]
# During development the install root must stay inside Synnical's data directory.
root = ~/.local/share/synnical/test-root
cache = ~/.cache/synnical

[build]
jobs = 4
show_output = false

[download]
progress = true
style = trail
